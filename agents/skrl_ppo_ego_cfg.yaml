# skrl_ppo_ego_cfg.yaml
# ======================================================
# PPO config for IrisExploreEgoEnv
#
# Observation flat vector layout:
#   [0 : M*M]      egocentric map (40*40 = 1600 values)
#   [1600 : 1606]  state (6 values)
#   Total: 1606
#
# Network design:
#   The egocentric map is a 40x40 image of the drone's local
#   surroundings. Values: -1=wall, 0=unknown, 1=free.
#   A small CNN extracts spatial features from this.
#   A small MLP processes the 6-value state.
#   Both are concatenated and passed to policy/value heads.
#
# use the flat MLP
# ======================================================

seed: 42

models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 256
  learning_epochs: 8
  mini_batches: 8

  # High gamma: success bonus at end of 60s episode must be visible
  discount_factor: 0.995
  lambda: 0.95

  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01

  state_preprocessor: RunningStandardScaler
  value_preprocessor: RunningStandardScaler

  value_loss_scale: 0.5
  ratio_clip: 0.2
  grad_norm_clip: 0.5
  clip_predicted_values: True

  # Entropy: keep high to prevent early collapse to stationary policy
  entropy_loss_scale: 0.08

  experiment:
    directory: "iris_ego_explore"
    experiment_name: "egocentric_map_cnn"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 1000000
  environment_info: log


